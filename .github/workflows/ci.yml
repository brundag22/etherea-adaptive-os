name: WebOS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  webos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: etherea-webos/package-lock.json

      - name: Install
        run: cd etherea-webos && npm ci --no-audit --no-fund

      - name: Lint
        run: cd etherea-webos && npm run lint

      - name: Typecheck
        run: cd etherea-webos && npm run typecheck

      - name: Build
        run: cd etherea-webos && npm run web:build
