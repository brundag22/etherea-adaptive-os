name: WebOS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  webos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: etherea-webos/package-lock.json

      - name: Force public npm registry
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config delete @etherea:registry || true

      - name: Clear proxy npm env
        run: |
          echo "HTTP_PROXY=" >> "$GITHUB_ENV"
          echo "HTTPS_PROXY=" >> "$GITHUB_ENV"
          echo "http_proxy=" >> "$GITHUB_ENV"
          echo "https_proxy=" >> "$GITHUB_ENV"
          echo "npm_config_http_proxy=" >> "$GITHUB_ENV"
          echo "npm_config_https_proxy=" >> "$GITHUB_ENV"

      - name: Install
        run: cd etherea-webos && npm ci --no-audit --no-fund

      - name: Lint
        run: cd etherea-webos && npm run lint

      - name: Typecheck
        run: cd etherea-webos && npm run typecheck

      - name: Build
        run: cd etherea-webos && npm run web:build
