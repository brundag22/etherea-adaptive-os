name: Firebase Hosting Deploy

on:
  push:
    branches: [main]
    paths:
      - 'etherea-webos/**'
      - '.github/workflows/**'

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_FETCH_RETRIES: 5
  NPM_CONFIG_FETCH_RETRY_FACTOR: 2
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 20000
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: etherea-webos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: WebOS install (deterministic)
        run: npm ci --no-audit --no-fund

      - name: Build core/ui/web
        run: |
          set -euo pipefail
          npm run build -w @etherea/core
          npm run build -w @etherea/ui
          npm run build -w @etherea/web

      - name: Selfcheck
        run: |
          set -euo pipefail
          npm run selfcheck

      - name: Preflight: verify web build output and Firebase config
        run: |
          set -euo pipefail
          test -f apps/web/dist/index.html
          python -c "import json; json.load(open('firebase.json','r',encoding='utf-8'))"
          echo "Preflight checks passed: dist/index.html exists and firebase.json parses."

      - name: Deploy
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ETHEREA_WORKSPACE }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: etherea-webos

      - name: Deployed URL
        run: |
          set -euo pipefail
          DETAILS_URL="${{ steps.deploy.outputs.details_url }}"
          if [ -n "$DETAILS_URL" ]; then
            echo "Hosting details URL: $DETAILS_URL"
          else
            echo "Hosting details URL unavailable from action output."
          fi
          echo "Expected production site URL: https://etherea-adaptive-os.web.app"
