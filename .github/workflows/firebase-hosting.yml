name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: etherea-webos/package-lock.json

      - name: Install
        run: cd etherea-webos && npm ci --no-audit --no-fund

      - name: Lint
        run: cd etherea-webos && npm run lint

      - name: Typecheck
        run: cd etherea-webos && npm run typecheck

      - name: Build
        run: cd etherea-webos && npm run web:build

      - name: Validate Firebase secrets
        if: ${{ secrets.FIREBASE_PROJECT_ID == '' || secrets.FIREBASE_SERVICE_ACCOUNT_JSON == '' }}
        run: |
          echo "Missing required Firebase secrets (FIREBASE_PROJECT_ID and/or FIREBASE_SERVICE_ACCOUNT_JSON)."
          exit 1

      - name: Authenticate Firebase service account
        if: ${{ secrets.FIREBASE_PROJECT_ID != '' && secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          cat > "$RUNNER_TEMP/firebase-sa.json" <<EOF
          $FIREBASE_SERVICE_ACCOUNT_JSON
          EOF
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Deploy Firebase Hosting
        if: ${{ secrets.FIREBASE_PROJECT_ID != '' && secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        run: cd etherea-webos && npx firebase-tools@latest deploy --project "$FIREBASE_PROJECT_ID" --only hosting
